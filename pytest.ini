[pytest]
testpaths = .
norecursedirs = .git .venv .pytest_cache venv __pycache__ runtime output build dist .test-results generated
addopts = -ra
markers =
    integration: exercises the service with multiple collaborators
    manual: requires a person to inspect the user interface
    case(id): links a test to one of the 60 acceptance IDs (I01-I10, S01-S09, R01-R07, A01-A12, P01-P08, O01-O08, L01-L06); a unit test does not replace the independent run of that case
