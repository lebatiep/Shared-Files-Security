name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m secure_share --check
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m tools.case_report --run --json .test-results/cases.json
      - if: runner.os == 'Windows'
        run: python -m tools.case_report --run --json .test-results/cases.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}
          path: .test-results/cases.json
          include-hidden-files: true
      - run: python -m tools.demo
      - run: python -m tools.demo_threshold
